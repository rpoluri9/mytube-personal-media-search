# --- DataSource: file-based H2 so the library persists across restarts ---
spring.datasource.url=jdbc:h2:file:./data/mytube;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Recreate schema + reseed on every boot (dev/demo friendly)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Where generated thumbnails are stored (served at /thumbnails/**)
mytube.thumbnail-dir=./data/thumbnails

server.port=8080
