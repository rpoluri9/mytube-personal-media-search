# --- DataSource: file-based H2 so the library persists across restarts ---
spring.datasource.url=jdbc:h2:file:./data/mytube;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Recreate schema + reseed on every boot (dev/demo friendly)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Where generated thumbnails are stored (served at /thumbnails/**)
mytube.thumbnail-dir=./data/thumbnails

# --- Web image search: identify ANY screenshot + related YouTube videos (optional) ---
# 1) Get a free key: console.cloud.google.com -> create a project -> enable
#    "Cloud Vision API" AND "YouTube Data API v3" -> Credentials -> Create API key.
# 2) Paste the key below and restart. One key covers both APIs.
# Leave blank to keep local-library-only matching (v1 behaviour).
mytube.google.api-key=
# Max YouTube videos returned per image search (1-50).
mytube.youtube.max-results=5

server.port=8080
